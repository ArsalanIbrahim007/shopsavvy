<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopSavvy - Compare prices across Pakistani ecommerce stores in one place" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1524" media="(prefers-color-scheme: dark)" />
    <!-- Applies a saved light/dark choice before the first paint, so there is no flash. Key: see src/lib/theme.js -->
    <script>
      try {
        var t = localStorage.getItem("shopsavvy:theme:v1");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <title>ShopSavvy - Compare Prices in Pakistan</title>
    <!-- Link previews (WhatsApp, Facebook, X). The picture and address are added at build from SITE_URL: scripts/socialMeta.js -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShopSavvy" />
    <meta property="og:title" content="ShopSavvy - Compare Prices in Pakistan" />
    <meta property="og:description" content="One search, every store's price: compare prices across Pakistan's online stores, with price history and honest discounts." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
